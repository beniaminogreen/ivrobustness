[package]
name = 'ivrobustness'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ivrobustness'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
argmin = "0.11.0"
argmin-math = { version = "0.5", features = ["vec"] }
extendr-api = {version = '*', features = ['ndarray']}
nalgebra = "0.35"
num-dual = {version = "0.15.0"}
rand = "0.9.5"
rand_distr = "0.5.1"


[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 3         
lto = "fat"            
codegen-units = 1      
